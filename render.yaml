# Render blueprint for the OM Cellular API.
# Usage: connect this GitHub repo as a Blueprint in Render.com (or use the
# "Blueprint" install from the Render dashboard and select the repo).
# The web service reads server/.env-style secrets from Render's environment.

services:
  - type: web
    name: om-cellular-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false